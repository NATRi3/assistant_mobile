<svg xmlns="http://www.w3.org/2000/svg" width="412" height="940" viewBox="0 0 412 940" role="img" aria-labelledby="title description"><title id="title">D05 · Напоминание · light · snoozed</title><desc id="description">ДИЗАЙН · СИНТЕТИЧЕСКИЙ ПРИМЕР. Направление A: Тихий рабочий стол. Состояние snoozed. Редактируемые текстовые и векторные слои; не приложение.</desc><g font-family="system-ui, sans-serif"><rect x="0" y="0" width="412" height="940" rx="0" fill="#F4F6F5"/><rect x="0" y="0" width="412" height="28" rx="0" fill="#E3EEE8"/><text x="24" y="19" fill="#182B28" font-size="10" font-weight="600">ДИЗАЙН · СИНТЕТИЧЕСКИЙ ПРИМЕР</text><text x="24" y="54" fill="#182B28" font-size="14" font-weight="600">09:41</text><text x="322" y="54" fill="#182B28" font-size="14" font-weight="400">●  ▰</text><text x="24" y="101" fill="#182B28" font-size="24" font-weight="400">←</text><text x="73" y="99" fill="#182B28" font-size="18" font-weight="650">Ассистент</text><text x="356" y="99" fill="#182B28" font-size="22" font-weight="400">☰</text><text x="24" y="143" fill="#52635F" font-size="11" font-weight="650">ЛИЧНЫЙ АССИСТЕНТ</text><text x="24" y="184" fill="#182B28" font-size="30" font-weight="650">Напоминание</text><rect x="24" y="216" width="364" height="238" rx="24" fill="#FFFFFF" stroke="#758781"/><text x="48" y="254" fill="#52635F" font-size="10" font-weight="650">ПОДТВЕРЖДЁННОЕ НАПОМИНАНИЕ</text><text x="48" y="304.0" fill="#182B28" font-size="24" font-weight="650">Позвонить в мастерскую</text><text x="48" y="384" fill="#182B28" font-size="18" font-weight="400">Сегодня, 10:10</text><text x="48" y="421" fill="#52635F" font-size="13" font-weight="400">Версия примера · обновлено 09:40</text><rect x="24" y="478" width="364" height="62" rx="12" fill="#E3EEE8"/><text x="40" y="515" fill="#182B28" font-size="15" font-weight="600">Отложено на 10 минут в примере</text><rect x="24" y="568" width="364" height="56" rx="16" fill="#E3EEE8" stroke="#758781"/><text x="44" y="603" fill="#52635F" font-size="16" font-weight="600">Отложить на 10 минут</text><rect x="24" y="636" width="364" height="56" rx="16" fill="#FFFFFF" stroke="#758781"/><text x="44" y="671" fill="#255F52" font-size="16" font-weight="600">К «Сегодня»</text><text x="24" y="734.0" fill="#52635F" font-size="13" font-weight="400">Повтор не создаёт второй эффект.</text><text x="24" y="753.5" fill="#52635F" font-size="13" font-weight="400">Реальные команды не отправляются.</text><rect x="0" y="860" width="412" height="80" rx="0" fill="#FFFFFF"/><rect x="24" y="872" width="174" height="48" rx="16" fill="#FFFFFF"/><rect x="214" y="872" width="174" height="48" rx="16" fill="#FFFFFF"/><text x="73" y="902" fill="#52635F" font-size="16" font-weight="600">Сегодня</text><text x="266" y="902" fill="#52635F" font-size="16" font-weight="600">Диалог</text></g></svg>
