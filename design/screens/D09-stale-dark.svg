<svg xmlns="http://www.w3.org/2000/svg" width="412" height="1012" viewBox="0 0 412 1012" role="img" aria-labelledby="title description"><title id="title">D09 · Push и виджет · dark · stale</title><desc id="description">ДИЗАЙН · СИНТЕТИЧЕСКИЙ ПРИМЕР. Направление A: Тихий рабочий стол. Состояние stale. Редактируемые текстовые и векторные слои; не приложение.</desc><g font-family="system-ui, sans-serif"><rect x="0" y="0" width="412" height="1012" rx="0" fill="#101C18"/><rect x="0" y="0" width="412" height="28" rx="0" fill="#293D32"/><text x="24" y="19" fill="#E3EFE8" font-size="10" font-weight="600">ДИЗАЙН · СИНТЕТИЧЕСКИЙ ПРИМЕР</text><text x="24" y="54" fill="#E3EFE8" font-size="14" font-weight="600">09:41</text><text x="322" y="54" fill="#E3EFE8" font-size="14" font-weight="400">●  ▰</text><text x="24" y="101" fill="#E3EFE8" font-size="24" font-weight="400">←</text><text x="73" y="99" fill="#E3EFE8" font-size="18" font-weight="650">Ассистент</text><text x="356" y="99" fill="#E3EFE8" font-size="22" font-weight="400">☰</text><text x="24" y="143" fill="#AEC3B7" font-size="11" font-weight="650">ЛИЧНЫЙ АССИСТЕНТ</text><text x="24" y="184" fill="#E3EFE8" font-size="30" font-weight="650">Push и виджет</text><rect x="24" y="216" width="364" height="52" rx="12" fill="#3B301B"/><text x="40" y="248" fill="#F6D997" font-size="14" font-weight="600">Данные устарели · обновите</text><text x="24" y="296" fill="#AEC3B7" font-size="10" font-weight="650">СИСТЕМНЫЕ ПОВЕРХНОСТИ · ПРИМЕР</text><rect x="24" y="320" width="364" height="190" rx="24" fill="#1A2B25" stroke="#7F9A8B"/><text x="48" y="357" fill="#AEC3B7" font-size="13" font-weight="400">Ассистент · Напоминания</text><text x="48" y="399.0" fill="#E3EFE8" font-size="18" font-weight="650">Пора проверить напоминание</text><rect x="48" y="438" width="316" height="48" rx="12" fill="#293D32" stroke="#7F9A8B"/><text x="64" y="468" fill="#A6D8C0" font-size="14" font-weight="600">Открыть        Отложить 10 мин</text><text x="24" y="554" fill="#AEC3B7" font-size="11" font-weight="650">ДОМАШНИЙ ВИДЖЕТ</text><rect x="24" y="578" width="364" height="186" rx="24" fill="#1A2B25" stroke="#7F9A8B"/><text x="48" y="622" fill="#E3EFE8" font-size="22" font-weight="650">Ассистент</text><text x="48" y="664" fill="#E3EFE8" font-size="16" font-weight="400">Открыть приложение</text><text x="48" y="703" fill="#AEC3B7" font-size="13" font-weight="400">Данные устарели · 09:40</text><text x="48" y="738" fill="#A6D8C0" font-size="14" font-weight="600">↗ Открыть через unlock</text><text x="24" y="814.0" fill="#AEC3B7" font-size="13" font-weight="400">Opt-in только count и time. Приватных</text><text x="24" y="833.5" fill="#AEC3B7" font-size="13" font-weight="400">текстов нет ни в push, ни в виджете.</text><rect x="0" y="932" width="412" height="80" rx="0" fill="#1A2B25"/><rect x="24" y="944" width="174" height="48" rx="16" fill="#1A2B25"/><rect x="214" y="944" width="174" height="48" rx="16" fill="#1A2B25"/><text x="73" y="974" fill="#AEC3B7" font-size="16" font-weight="600">Сегодня</text><text x="266" y="974" fill="#AEC3B7" font-size="16" font-weight="600">Диалог</text></g></svg>
