<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title description"><title id="title">Первый полезный путь</title><desc id="description">Редактируемая схема потоков и безопасных переходов Android MVP.</desc><g font-family="system-ui, sans-serif"><rect x="0" y="0" width="1120" height="700" rx="0" fill="#F4F6F5"/><text x="32" y="50" fill="#182B28" font-size="32" font-weight="650">Первый полезный путь</text><text x="32" y="84" fill="#52635F" font-size="15" font-weight="400">Синтетический дизайн-flow · AS-83 · A / Тихий рабочий стол</text><rect x="32" y="120" width="316" height="132" rx="20" fill="#FFFFFF" stroke="#758781"/><text x="52" y="160" fill="#182B28" font-size="18" font-weight="650">D01 · Подключить</text><text x="52" y="198.0" fill="#52635F" font-size="14" font-weight="400">Доверенный owner-канал</text><rect x="402" y="120" width="316" height="132" rx="20" fill="#FFFFFF" stroke="#758781"/><text x="422" y="160" fill="#182B28" font-size="18" font-weight="650">D02 · Сегодня</text><text x="422" y="198.0" fill="#52635F" font-size="14" font-weight="400">Существующие Task/Reminder</text><rect x="772" y="120" width="316" height="132" rx="20" fill="#FFFFFF" stroke="#758781"/><text x="792" y="160" fill="#182B28" font-size="18" font-weight="650">D04 · Завершить</text><text x="792" y="198.0" fill="#52635F" font-size="14" font-weight="400">Явная команда · свежая версия</text><rect x="32" y="310" width="316" height="132" rx="20" fill="#FFFFFF" stroke="#758781"/><text x="52" y="350" fill="#182B28" font-size="18" font-weight="650">D09 · Generic push</text><text x="52" y="388.0" fill="#52635F" font-size="14" font-weight="400">Нет названий или source text</text><rect x="402" y="310" width="316" height="132" rx="20" fill="#FFFFFF" stroke="#758781"/><text x="422" y="350" fill="#182B28" font-size="18" font-weight="650">Unlock → fresh fetch</text><text x="422" y="388.0" fill="#52635F" font-size="14" font-weight="400">Device/session/expiry/version</text><rect x="772" y="310" width="316" height="132" rx="20" fill="#FFFFFF" stroke="#758781"/><text x="792" y="350" fill="#182B28" font-size="18" font-weight="650">D05 · Snooze 10 мин</text><text x="792" y="388.0" fill="#52635F" font-size="14" font-weight="400">Одна новая версия Reminder</text><rect x="32" y="500" width="316" height="132" rx="20" fill="#FFFFFF" stroke="#758781"/><text x="52" y="540" fill="#182B28" font-size="18" font-weight="650">D03 · Текстовый диалог</text><text x="52" y="578.0" fill="#52635F" font-size="14" font-weight="400">Ожидание / ошибка / unknown</text><rect x="402" y="500" width="316" height="132" rx="20" fill="#FFFFFF" stroke="#758781"/><text x="422" y="540" fill="#182B28" font-size="18" font-weight="650">D09 · Малый виджет</text><text x="422" y="578.0" fill="#52635F" font-size="14" font-weight="400">Opt-in только count/time</text><rect x="772" y="500" width="316" height="132" rx="20" fill="#FFFFFF" stroke="#758781"/><text x="792" y="540" fill="#182B28" font-size="18" font-weight="650">D08 · Logout/revoke self</text><text x="792" y="578.0" fill="#52635F" font-size="14" font-weight="400">Локальное скрытие, серверный</text><text x="792" y="599.0" fill="#52635F" font-size="14" font-weight="400">отзыв</text><text x="356" y="191" fill="#255F52" font-size="24" font-weight="650">→</text><text x="726" y="191" fill="#255F52" font-size="24" font-weight="650">→</text><text x="356" y="381" fill="#255F52" font-size="24" font-weight="650">→</text><text x="726" y="381" fill="#255F52" font-size="24" font-weight="650">→</text><text x="356" y="571" fill="#255F52" font-size="24" font-weight="650">→</text><text x="726" y="571" fill="#255F52" font-size="24" font-weight="650">→</text><text x="32" y="671" fill="#52635F" font-size="14" font-weight="400">Offline/stale: команды заблокированы. Unknown: сначала сверка. Отзыв не обещает удалённый offline wipe.</text></g></svg>
